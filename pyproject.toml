[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdmtsp-hse-research"
version = "0.1.0"
description = "Research repository for MDMTSP heuristics, experiments, aggregation, and visualization tooling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "German Shtukmaister" }
]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "twine>=5.1",
]

[tool.setuptools]
packages = []
include-package-data = false

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "scripts",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
