name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: build
  CMAKE_BUILD_TYPE: Release
  PYTHON_VERSION: '3.12'

jobs:
  cpp-build-and-test:
    name: C++ build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >-
          cmake -S . -B "${BUILD_DIR}"
          -DCMAKE_BUILD_TYPE="${CMAKE_BUILD_TYPE}"
          -DMDMTSP_BUILD_TESTS=ON

      - name: Build
        run: cmake --build "${BUILD_DIR}" --config "${CMAKE_BUILD_TYPE}" --parallel

      - name: Run CTest
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest --build-config "${CMAKE_BUILD_TYPE}" --output-on-failure

      - name: Upload CTest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.os }}
          path: |
            build/Testing/**
            build/bin/**
          if-no-files-found: ignore

  repository-sanity:
    name: Repository sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib numpy openpyxl

      - name: Run repository sanity checks
        env:
          CI_ARTIFACTS_DIR: ${{ github.workspace }}/.ci-artifacts
          CI_MAX_SOLUTION_CUSTOMERS: '500'
          CI_SOLUTION_WORKERS: '2'
        run: bash scripts/ci_sanity.sh

      - name: Upload sanity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-sanity-artifacts
          path: .ci-artifacts/**
          if-no-files-found: ignore
